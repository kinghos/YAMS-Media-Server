networks:
  default:
    external: true
    name: yams_network

services:
  seerr:
    image: ghcr.io/seerr-team/seerr:latest
    container_name: seerr
    user: ${PUID}:${PGID}
    environment:
      - TZ=${TZ}
      - LOG_LEVEL=debug
    ports:
      - 5055:5055
    volumes:
      - ${INSTALL_DIRECTORY}/config/seerr:/app/config
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:5055/api/v1/status || exit 1
      start_period: 20s
      timeout: 3s
      interval: 15s
      retries: 3
    security_opt:
      - no-new-privileges
    cap_drop:
      - ALL
    restart: unless-stopped
    networks:
      default:
        ipv4_address: 172.60.0.22

  trawl:
    image: ghcr.io/germondai/trawl:latest
    container_name: trawl
    restart: unless-stopped
    environment:
      - MITM_ENABLED=true
    ports:
      - 8191:8191
      # MITM proxy (only when MITM_ENABLED=true). CA cert at :8191/proxy-ca.crt
      - 8192:8192
    shm_size: 1gb

  prowlarr:
    volumes:
      - /opt/yams/config/prowlarr/custom-cont-init.d:/custom-cont-init.d:ro


  cleanuparr:
    image: ghcr.io/cleanuparr/cleanuparr:latest
    container_name: cleanuparr
    restart: unless-stopped
    ports:
     - "11011:11011"
    volumes:
      - ${INSTALL_DIRECTORY}/config/cleanuparr:/config
    environment:
      - PORT=11011
      - PUID=${PUID}
      - PGID=${PGID}
      - UMASK=022
      - TZ=${TZ}
    # Health check configuration
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11011/health"]
      interval: 30s        # Check every 30 seconds
      timeout: 10s         # Allow up to 10 seconds for response
      start_period: 30s    # Wait 30 seconds before first check
      retries: 3           # Mark unhealthy after 3 consecutive failures

  tailscale:
    image: tailscale/tailscale:latest
    container_name: tailscale
    hostname: tailscale-nginx
    network_mode: host
    environment:
      - TS_AUTHKEY=tskey-auth-khwiZ29bF221CNTRL-mndGBpTYYTHr7CdH4VUuTHrpsiadCJe4
      - TS_STATE_DIR=/var/lib/tailscale
    volumes:
      - ./tailscale-state:/var/lib/tailscale
    cap_add:
      - net_admin
      - net_raw
    restart: unless-stopped
    
  nginx:
    image: nginx:latest
    container_name: nginx_server
    ports:
      - "8082:80"
    depends_on:
      - tailscale
    restart: unless-stopped
