networks:
  default:
    external: true
    name: yams_network

services:
  seerr:
    image: ghcr.io/seerr-team/seerr:latest
    container_name: seerr
    user: ${PUID}:${PGID}
    environment:
      - TZ=${TZ}
      - LOG_LEVEL=debug
    ports:
      - 5055:5055
    volumes:
      - ${INSTALL_DIRECTORY}/config/seerr:/app/config
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:5055/api/v1/status || exit 1
      start_period: 20s
      timeout: 3s
      interval: 15s
      retries: 3
    security_opt:
      - no-new-privileges
    cap_drop:
      - ALL
    restart: unless-stopped
    networks:
      default:
        ipv4_address: 172.60.0.22

  trawl:
    image: ghcr.io/germondai/trawl:latest
    container_name: trawl
    restart: unless-stopped
    environment:
      - MITM_ENABLED=true
    ports:
      - 8191:8191
      # MITM proxy (only when MITM_ENABLED=true). CA cert at :8191/proxy-ca.crt
      - 8192:8192
    shm_size: 1gb

  prowlarr:
    volumes:
      - /opt/yams/config/prowlarr/custom-cont-init.d:/custom-cont-init.d:ro

  nginx-proxy-manager:
    image: 'jc21/nginx-proxy-manager:latest'
    container_name: npm
    restart: unless-stopped
    ports:
      - '80:80'
      - '81:81'
      - '443:443'
    volumes:
      - ${INSTALL_DIRECTORY}/config/npm/data:/data
      - ${INSTALL_DIRECTORY}/config/npm/etc/letsencrypt:/etc/letsencrypt

  pihole:
    image: docker.io/pihole/pihole:latest
    container_name: pihole
    restart: unless-stopped
    ports:
      - "53:53/tcp"
      - "53:53/udp"
      - "8082:80/tcp"
    environment:
      TZ: ${TZ}
      FTLCONF_webserver_api_password: ${PIHOLE_PASSWORD}
    volumes:
      - ${INSTALL_DIRECTORY}/config/pihole/etc-pihole:/etc/pihole
      - ${INSTALL_DIRECTORY}/config/pihole/etc-dnsmasq.d:/etc/dnsmasq.d
